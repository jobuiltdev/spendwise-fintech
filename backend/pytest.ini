[pytest]
# Django settings used for the whole test session — the same settings module the
# app uses, so tests exercise real configuration rather than a test-only variant.
DJANGO_SETTINGS_MODULE = spendwise.settings

# settings.py reads SECRET_KEY (and friends) from the environment via
# django-environ, and SECRET_KEY has no default. These entries supply test values
# early enough for pytest-django to configure Django, so `pytest` works on a
# clean checkout and in CI without a .env file.
#
# The "D:" prefix means "default": a real environment variable always wins, so
# this never overrides a developer's or CI's own configuration, and settings.py
# is left completely untouched.
env =
    D:SECRET_KEY=test-only-insecure-secret-key-not-for-use-outside-tests
    D:DEBUG=False
    D:ALLOWED_HOSTS=localhost,127.0.0.1,testserver
    D:GOOGLE_OAUTH_CLIENT_ID=

# Collect both pytest-style modules and Django's conventional per-app tests.py,
# so existing Django TestCase classes are picked up without being moved.
python_files = test_*.py tests.py

# Keep collection inside project code.
norecursedirs = venv .venv .git __pycache__ migrations media staticfiles

addopts = -ra --strict-markers --strict-config
